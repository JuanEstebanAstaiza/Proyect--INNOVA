# Configuración de ejemplo para Apache con mod_wsgi
# Este archivo debe ser incluido en la configuración de Apache

<VirtualHost *:80>
    ServerName alcaldias.midominio.com
    ServerAlias www.alcaldias.midominio.com

    # Directorio raíz de la aplicación
    DocumentRoot /var/www/alcaldias

    # Configuración de WSGI
    WSGIDaemonProcess alcaldias user=www-data group=www-data threads=5 python-home=/var/www/alcaldias/venv
    WSGIScriptAlias / /var/www/alcaldias/wsgi.py

    # Configuración del directorio
    <Directory /var/www/alcaldias>
        WSGIProcessGroup alcaldias
        WSGIApplicationGroup %{GLOBAL}
        Require all granted
    </Directory>

    # Configuración de archivos estáticos
    Alias /static /var/www/alcaldias/app/static
    <Directory /var/www/alcaldias/app/static>
        Require all granted
    </Directory>

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/alcaldias_error.log
    CustomLog ${APACHE_LOG_DIR}/alcaldias_access.log combined

    # Configuración de seguridad adicional
    <Location />
        Header always set X-Content-Type-Options nosniff
        Header always set X-Frame-Options DENY
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </Location>
</VirtualHost>

# Configuración SSL (opcional pero recomendado)
<VirtualHost *:443>
    ServerName alcaldias.midominio.com
    ServerAlias www.alcaldias.midominio.com

    # Configuración SSL
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/alcaldias.crt
    SSLCertificateKeyFile /etc/ssl/private/alcaldias.key

    # Misma configuración que arriba pero con SSL
    DocumentRoot /var/www/alcaldias

    WSGIDaemonProcess alcaldias-ssl user=www-data group=www-data threads=5 python-home=/var/www/alcaldias/venv
    WSGIScriptAlias / /var/www/alcaldias/wsgi.py

    <Directory /var/www/alcaldias>
        WSGIProcessGroup alcaldias-ssl
        WSGIApplicationGroup %{GLOBAL}
        Require all granted
    </Directory>

    Alias /static /var/www/alcaldias/app/static
    <Directory /var/www/alcaldias/app/static>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/alcaldias_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/alcaldias_ssl_access.log combined

    <Location />
        Header always set X-Content-Type-Options nosniff
        Header always set X-Frame-Options DENY
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </Location>
</VirtualHost>
