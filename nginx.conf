# Configuración de ejemplo para Nginx con Gunicorn
# Este archivo debe ser colocado en /etc/nginx/sites-available/alcaldias
# y enlazado a /etc/nginx/sites-enabled/

upstream alcaldias_app {
    # Servidores Gunicorn (ajuste según su configuración)
    server 127.0.0.1:8000;
    server 127.0.0.1:8001;
    server 127.0.0.1:8002;
}

server {
    listen 80;
    server_name alcaldias.midominio.com www.alcaldias.midominio.com;

    # Directorio raíz
    root /var/www/alcaldias;

    # Logs
    access_log /var/log/nginx/alcaldias_access.log;
    error_log /var/log/nginx/alcaldias_error.log;

    # Configuración de archivos estáticos
    location /static {
        alias /var/www/alcaldias/app/static;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Configuración de archivos media (si los hay)
    location /media {
        alias /var/www/alcaldias/app/static/media;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy a Gunicorn
    location / {
        proxy_pass http://alcaldias_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Configuración de timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Configuración de buffers
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Configuración de seguridad
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Configuración de compresión
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
}

# Configuración SSL (opcional pero recomendado)
server {
    listen 443 ssl http2;
    server_name alcaldias.midominio.com www.alcaldias.midominio.com;

    # Configuración SSL
    ssl_certificate /etc/ssl/certs/alcaldias.crt;
    ssl_certificate_key /etc/ssl/private/alcaldias.key;

    # Configuración SSL adicional
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Misma configuración que arriba
    root /var/www/alcaldias;

    access_log /var/log/nginx/alcaldias_ssl_access.log;
    error_log /var/log/nginx/alcaldias_ssl_error.log;

    location /static {
        alias /var/www/alcaldias/app/static;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media {
        alias /var/www/alcaldias/app/static/media;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://alcaldias_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
}

# Redirección de HTTP a HTTPS (opcional)
server {
    listen 80;
    server_name alcaldias.midominio.com www.alcaldias.midominio.com;
    return 301 https://$server_name$request_uri;
}
